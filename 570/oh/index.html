<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Office Hours</title>
  <style>
    :root {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #222;
      background: #f5f7fa;
    }

    body {
      max-width: 32rem;
      margin: 3rem auto;
      padding: 0 1.25rem;
      line-height: 1.5;
    }

    h1 {
      margin: 0 0 1rem;
      font-size: 1.5rem;
    }

    .options {
      display: grid;
      gap: 0.75rem;
    }

    .option {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.75rem 0.9rem;
      background: #fff;
      border: 1px solid #d8dee6;
      border-radius: 0.35rem;
    }

    .option input {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      clip-path: inset(50%);
      white-space: nowrap;
    }

    .checkbox {
      display: grid;
      flex: 0 0 1rem;
      width: 1rem;
      height: 1rem;
      place-items: center;
      background: #fff;
      border: 2px solid #8a949e;
      border-radius: 0.2rem;
    }

    .option input:checked + .checkbox {
      background: #2e7d32;
      border-color: #2e7d32;
    }

    .option input:checked + .checkbox::after {
      width: 0.45rem;
      height: 0.25rem;
      content: "";
      border: solid #fff;
      border-width: 0 0 2px 2px;
      transform: rotate(-45deg) translate(0.02rem, -0.04rem);
    }

    a {
      color: #1769aa;
    }
  </style>
</head>
<body>
  <main>
    <h1>OH today are:</h1>
    <!-- Add or remove "checked" to advertise each option. "disabled" keeps visitors from changing it. -->
    <div class="options">
      <label class="option">
        <input type="checkbox" checked disabled>
        <span class="checkbox" aria-hidden="true"></span>
        <span>In person (4844 BBB) (PLEASE EMAIL ME TO JOIN THE OH QUEUE TODAY, jonaher@umich.edu)</span>
      </label>
      <label class="option">
        <input type="checkbox" disabled>
        <span class="checkbox" aria-hidden="true"></span>
        <a href="https://umich.zoom.us/j/2210670111">On Zoom</a>
      </label>
    </div>
  </main>
</body>
</html>
